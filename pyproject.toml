[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-event-reconstruction"
version = "0.1.0"
description = "Topology-aware visible and invisible particle-event reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py",
  "lightning>=2.5,<2.6",
  "matplotlib",
  "numpy",
  "omegaconf",
  "pandas",
  "scikit-learn",
  "scipy",
  "tensorboard",
  "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["joint_event_reconstruction*"]
