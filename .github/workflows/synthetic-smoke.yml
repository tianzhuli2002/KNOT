name: synthetic-smoke

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements.yaml"
      - ".github/workflows/synthetic-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topology: [ttbar1L, ttbar2L, synthetic_contract, synthetic_multinu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install project and static checker
        run: python -m pip install -e . tensorboard ruff
      - name: Compile maintained Python
        run: python -m compileall -q src scripts
      - name: Check fatal static errors
        run: ruff check src scripts --select E9,F63,F7,F82
      - name: Validate compact experiment configs
        run: |
          python - <<'PY'
          from pathlib import Path
          from joint_event_reconstruction.configuration import load_experiment, load_visible_config

          for path in sorted(Path("configs/experiments").glob("*.yaml")):
              config = load_experiment(path)
              visible = load_visible_config(config)
              assert visible.dataset.observables
              print(f"validated {path}")
          PY
      - name: Validate maintained study manifests and resolved patches
        if: matrix.topology == 'ttbar2L'
        run: |
          set -euo pipefail
          for study in configs/studies/*.yaml; do
            python scripts/run_study.py "$study" plan --device cpu --dry-run
          done
      - name: Validate filtered dependency closure and Slurm planning
        if: matrix.topology == 'ttbar2L'
        run: |
          python scripts/submit_study_slurm.py configs/studies/04_c2_feedback.yaml \
            --variants c2 --dry-run --no-postprocess --output-root /tmp/jer-study-slurm
      - name: Synthetic smoke
        run: python scripts/smoke_synthetic.py --topology ${{ matrix.topology }} --device cpu --events 4
      - name: Synthetic benchmark smoke
        if: matrix.topology == 'ttbar2L'
        run: |
          python scripts/benchmark_synthetic.py \
            --experiment configs/experiments/ttbar2L.yaml \
            --modes visible cfm dfm joint \
            --device cpu --events 2 --warmup 0 --iterations 1 \
            --posterior-samples 1 --flow-steps 1 --joint-sample-chunk-size 1
      - name: Recurrence-control generator smoke
        if: matrix.topology == 'ttbar2L'
        run: |
          python scripts/match_recurrence_controls.py \
            --experiment configs/experiments/ttbar2L.yaml \
            --target m3 --recurrent-steps 2 --max-layers 1 \
            --feedforward-min 128 --feedforward-max 128 --feedforward-step 32 \
            --top 1 --benchmark-candidates 1 --device cpu \
            --events 2 --warmup 0 --iterations 1
