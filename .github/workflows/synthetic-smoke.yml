name: synthetic-smoke

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/smoke_*.py"
      - "configs/**"
      - "pyproject.toml"
      - "requirements.yaml"
      - ".github/workflows/synthetic-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topology: [ttbar1L, ttbar2L, synthetic_contract, synthetic_multinu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install project
        run: python -m pip install -e . tensorboard
      - name: Synthetic smoke
        run: python scripts/smoke_synthetic.py --topology ${{ matrix.topology }} --device cpu --events 4
