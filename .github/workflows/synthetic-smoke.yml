name: synthetic-smoke

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements.yaml"
      - ".github/workflows/synthetic-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topology: [ttbar1L, ttbar2L, synthetic_contract, synthetic_multinu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install project and static checker
        run: python -m pip install -e . tensorboard ruff
      - name: Compile maintained Python
        run: python -m compileall -q src scripts
      - name: Check fatal static errors
        run: ruff check src scripts --select E9,F63,F7,F82
      - name: Validate compact experiment configs
        run: |
          python - <<'PY'
          from pathlib import Path
          from joint_event_reconstruction.configuration import load_experiment, load_visible_config
          for path in sorted(Path("configs/experiments").glob("*.yaml")):
              config = load_experiment(path)
              load_visible_config(config)
              print(f"validated {path}")
          PY
      - name: Validate structured study manifests
        if: matrix.topology == 'ttbar2L'
        run: |
          python - <<'PY'
          from pathlib import Path
          from omegaconf import OmegaConf
          from joint_event_reconstruction.configuration import validate_experiment
          from joint_event_reconstruction.public_config import resolve_public_experiment
          from joint_event_reconstruction.studies import load_study

          root = Path.cwd()
          for path in sorted(Path("configs/studies").glob("*.yaml")):
              study = load_study(path)
              for topology in study.topologies:
                  experiment = study.experiment_path(root, topology)
                  base = OmegaConf.load(experiment)
                  for seed in study.seeds:
                      for variant in study.variants:
                          public = OmegaConf.merge(
                              base,
                              OmegaConf.create(variant.patch),
                              {"experiment": {"seed": seed}, "training": {"output": "/tmp/jer-study-ci"}},
                          )
                          validate_experiment(resolve_public_experiment(public))
                          for prediction in variant.predictions:
                              validate_experiment(
                                  resolve_public_experiment(
                                      OmegaConf.merge(public, OmegaConf.create(prediction.patch))
                                  )
                              )
              print(f"validated {path}")
          PY
      - name: Synthetic smoke
        run: python scripts/smoke_synthetic.py --topology ${{ matrix.topology }} --device cpu --events 4
      - name: Synthetic benchmark smoke
        if: matrix.topology == 'ttbar2L'
        run: |
          python scripts/benchmark_synthetic.py \
            --experiment configs/experiments/ttbar2L.yaml \
            --modes visible cfm dfm joint \
            --device cpu --events 2 --warmup 0 --iterations 1 \
            --posterior-samples 1 --flow-steps 1 --joint-sample-chunk-size 1
