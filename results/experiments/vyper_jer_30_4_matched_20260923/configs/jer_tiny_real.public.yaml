experiment:
  name: vyper_jer_30_4_tiny_real_validation
  seed: 20260923

topology: configs/topology/ttbar2L.yaml

data:
  input: results/experiments/vyper_jer_30_4_matched_20260923/validation/tiny_real/ttbar2L_tiny.h5
  cache: null
  subset_seed: 20260923
  test_size: 0.2
  split: {indices_path: null, require_existing: false}
  events: {train: 32, validation: 16, test: 16}
  max_assignment_states: 100000

inputs:
  transforms:
    e: log
    eta: [minmax, -2.5, 2.5]
    phi: sincos
    pt: log
    btag: [minmax, 0, 6]
    charge: [minmax, -1, 1]
    njet: [minmax, 0, 8]
    nelectron: [minmax, 0, 2]
    nmuon: [minmax, 0, 2]
    nBJets_90: [minmax, 0, 8]
    nBJets_85: [minmax, 0, 8]
    nBJets_77: [minmax, 0, 8]
    nBJets_70: [minmax, 0, 8]
    nBJets_65: [minmax, 0, 8]
  JET: {count: 8, features: [e, eta, phi, pt, btag, charge]}
  ELECTRON: {count: 1, features: [e, eta, phi, pt, charge]}
  MUON: {count: 1, features: [e, eta, phi, pt, charge]}
  MET: {count: 1, features: [phi, pt]}
  GLOBAL:
    features: [njet, nelectron, nmuon, nBJets_90, nBJets_85, nBJets_77, nBJets_70, nBJets_65]

model:
  latent: {d_model: 128, n_heads: 4, d_feedforward: 384, dropout: 0.05}
  encoder:
    type: lgatr
    layers: 4
    n_heads: 4
    hidden: {multivector_channels: 8, scalar_channels: 64}
    symmetry_breaking: {beam: xyplane, time: true}
  assignment: {formulation: discriminative}
  mode: factorized
  invisible:
    conditioning: {assignment: none}
    coordinates: {type: met_residual}
    generator: {type: cfm}
    mass_shell:
      enforcement: exact
      mass: {mode: fixed, value: 0.0, parameterization: null}
      roles: {}
  heads:
    point_invisible: {enabled: false}
    parent_four_vector: {enabled: false}

training:
  batch_size: 8
  workers: 0
  learning_rate: 0.000361545
  weight_decay: 0.00006073529387441413
  epochs: 1
  precision: 32-true
  trainable: [visible, assignment, invisible]
  loss_weights: {assignment: 1.0, invisible: 1.0}
  shared_encoder_gradients: both
  output: results/experiments/vyper_jer_30_4_matched_20260923/validation/jer_tiny_real

inference:
  seed: 20260923
  invisible:
    samples_per_assignment: 4
    flow: {steps: 2, solver: euler}
