# Charge-side semantic order for the partonic after-FSR data adapter.
# This is intentionally separate from the legacy flavour-side ttbar2L.yaml.
# The measured adapter orders LEPTON slot 1 positive/top-side and slot 2
# negative/antitop-side. NEUTRINO is truth-only; it is never a measured token.
# Its source binding is TARGETS/NEUTRINO top/antitop order. Finite producer-
# declared roles are supported; the legacy flavor-plus-charge disagreement
# is retained only as a diagnostic and does not change supervision.
topology:
  top:
    b: {source: JET, truth: top_b}
    lepton: {source: LEPTON, truth: top_lepton}
    nu: {source: NEUTRINO, truth: top_neutrino}
  antitop:
    b: {source: JET, truth: antitop_b}
    lepton: {source: LEPTON, truth: antitop_lepton}
    nu: {source: NEUTRINO, truth: antitop_neutrino}
