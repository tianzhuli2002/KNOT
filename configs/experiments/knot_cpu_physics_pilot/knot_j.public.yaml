    e: log
    eta:
    - minmax
    - -5.0
    - 5.0
    phi: sincos
    pt: log
    btag:
    - minmax
    - 0.0
    - 6.0
    charge:
    - minmax
    - -1.0
    - 1.0
    id: none
    njet:
    - minmax
    - 0.0
    - 20.0
    nelectron:
    - minmax
    - 0.0
    - 2.0
    nmuon:
    - minmax
    - 0.0
    - 2.0
    nBJets_90:
    - minmax
    - 0.0
    - 20.0
    nBJets_85:
    - minmax
    - 0.0
    - 20.0
    nBJets_77:
    - minmax
    - 0.0
    - 20.0
    nBJets_70:
    - minmax
    - 0.0
    - 20.0
    nBJets_65:
    - minmax
    - 0.0
    - 20.0
  JET:
    count: 8
    features:
    - e
    - eta
    - phi
    - pt
    - btag
    - id
  LEPTON:
    count: 2
    features:
    - e
    - eta
    - phi
    - pt
    - charge
    - id
  MET:
    count: 1
    features:
    - phi
    - pt
    - id
  GLOBAL:
    features:
    - njet
    - nelectron
    - nmuon
    - nBJets_90
    - nBJets_85
    - nBJets_77
    - nBJets_70
    - nBJets_65
model:
  latent:
    d_model: 128
    n_heads: 4
    d_feedforward: 384
    dropout: 0.05
  encoder:
    type: lgatr
    layers: 4
    n_heads: 4
    hidden:
      multivector_channels: 8
      scalar_channels: 64
    momentum_scale_gev: 100.0
    symmetry_breaking:
      beam: xyplane
      time: true
  assignment:
    formulation: discriminative
  mode: factorized
  topology_queries:
    enabled: true
    interaction: topology_plus_global
    layers: 2
    n_heads: 4
    dropout: 0.0
    roles:
    - name: top
      node: top
      kind: parent
      related:
      - ttbar
    - name: antitop
      node: antitop
      kind: parent
      related:
      - ttbar
    - name: ttbar
      node: null
      kind: global
      related:
      - top
      - antitop
    relations:
    - - top
      - ttbar
    - - antitop
      - ttbar
  invisible:
    conditioning:
      assignment: none
    coordinates:
      type: met_residual
    generator:
      type: cfm
      network:
        d_model: 128
        n_heads: 4
        layers: 4
        d_feedforward: 384
        dropout: 0.0
        zero_init_output: true
    mass_shell:
      enforcement: exact
      mass:
        mode: fixed
        value: 0.0
        parameterization: null
      roles: {}
  heads:
    point_invisible:
      enabled: false
    parent_four_vector:
      enabled: false
    partonic:
      enabled: false
  parent_cfm:
    enabled: true
    conditioning: P2
    target_path: /net/scratch/w00238tl/knot/results/experiments/partonic_ttbar2L_2M_realnu_v1/adapted/train_validation_authoritative_20260926/partonic_ttbar2l_train_validation_maxjets8_v1_supervision.h5
    layers: 4
    d_feedforward: 384
    sampling_steps: 8
    sampling_solver: heun
    n_heads: 4
    dropout: 0.0
    p2_neutrino_steps: 8
    p2_neutrino_solver: heun
inference:
  seed: 42011
  invisible:
    point_estimator: none
    flow:
      steps: 8
      solver: heun
training:
  batch_size: 128
  workers: 0
  optimizer:
    type: adamw
    fused_adamw: false
  learning_rate: 0.000361545
  weight_decay: 6.0735294e-05
  epochs: 20
  precision: 32-true
  trainable:
  - visible
  - assignment
  - invisible
  - queries
  - partonic_cfm
  loss_weights:
    assignment: 1.0
    invisible: 1.0
    partonic: 0.0
    partonic_cfm: 1.0
  output: /net/scratch/w00238tl/knot/results/experiments/knot/cpu-physics-pilot-v1/J
