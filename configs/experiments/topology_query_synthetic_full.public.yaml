experiment:
  name: topology_query_synthetic_full_three_task
  seed: 20260923

topology: configs/topology/ttbar2L.yaml

data:
  input: /net/scratch/w00238tl/JointEventReconstruction_topology_queries/results/experiments/topology_query_joint_20260923/synthetic_data/measured_v2.h5
  cache: null
  allow_synthetic: true
  subset_seed: 20260923
  test_size: 0.2
  split: {indices_path: null, require_existing: false}
  events: {train: 96, validation: 32, test: 32}
  max_assignment_states: 100000

inputs:
  transforms:
    e: log
    eta: [minmax, -3.0, 3.0]
    phi: sincos
    pt: log
    btag: [minmax, 0, 1]
    charge: [minmax, -1, 1]
    njet: [minmax, 0, 8]
    nelectron: [minmax, 0, 2]
    nmuon: [minmax, 0, 2]
    nBJets_90: [minmax, 0, 8]
    nBJets_85: [minmax, 0, 8]
    nBJets_77: [minmax, 0, 8]
    nBJets_70: [minmax, 0, 8]
    nBJets_65: [minmax, 0, 8]
  JET: {count: 8, features: [e, eta, phi, pt, btag, charge]}
  ELECTRON: {count: 1, features: [e, eta, phi, pt, charge]}
  MUON: {count: 1, features: [e, eta, phi, pt, charge]}
  MET: {count: 1, features: [phi, pt]}
  GLOBAL:
    features: [njet, nelectron, nmuon, nBJets_90, nBJets_85, nBJets_77, nBJets_70, nBJets_65]

model:
  latent: {d_model: 32, n_heads: 2, d_feedforward: 64, dropout: 0.0}
  encoder:
    type: lgatr
    layers: 1
    n_heads: 2
    hidden: {multivector_channels: 2, scalar_channels: 16}
    momentum_scale_gev: 100.0
    symmetry_breaking: {beam: xyplane, time: true}
  assignment: {formulation: discriminative}
  mode: factorized
  topology_queries:
    enabled: true
    interaction: full
    layers: 1
    n_heads: 2
    dropout: 0.0
    roles:
      - {name: top_e, node: top_e, kind: parent, related: [ttbar]}
      - {name: top_mu, node: top_mu, kind: parent, related: [ttbar]}
      - {name: ttbar, node: null, kind: global, related: [top_e, top_mu]}
    relations: [[top_e, ttbar], [top_mu, ttbar]]
  invisible:
    conditioning: {assignment: none}
    coordinates: {type: met_residual}
    generator:
      type: cfm
      network: {d_model: 32, n_heads: 2, layers: 1, d_feedforward: 64, dropout: 0.0, zero_init_output: true}
    mass_shell:
      enforcement: exact
      mass: {mode: fixed, value: 0.0, parameterization: null}
      roles: {}
  heads:
    point_invisible: {enabled: false}
    parent_four_vector: {enabled: false}
    partonic:
      enabled: true
      target_path: /net/scratch/w00238tl/JointEventReconstruction_topology_queries/results/experiments/topology_query_joint_20260923/synthetic_data/partonic_truth_v2.h5
      targets:
        - {role: top_e, truth_binding: synthetic_hard_process_top_e}
        - {role: top_mu, truth_binding: synthetic_hard_process_top_mu}
        - {role: ttbar, truth_binding: synthetic_hard_process_ttbar}

training:
  batch_size: 16
  workers: 0
  learning_rate: 0.001
  weight_decay: 0.0
  epochs: 2
  precision: 32-true
  trainable: [visible, assignment, invisible, queries, partonic]
  loss_weights: {assignment: 1.0, invisible: 1.0, partonic: 1.0}
  shared_encoder_gradients: both
  partonic_shared_encoder_gradients: both
  output: /net/scratch/w00238tl/JointEventReconstruction_topology_queries/results/experiments/topology_query_joint_20260923/training/full_three_task

inference:
  seed: 20260923
  invisible:
    samples_per_assignment: 2
    point_estimator: cfm_cartesian_mean
    flow: {steps: 2, solver: euler}
