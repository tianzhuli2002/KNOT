experiment:
  name: jer_charge_side_after_fsr_p5_v1
  seed: 42011
topology: configs/topology/ttbar2L_charge_ordered.yaml
data:
  input: /net/scratch/w00238tl/knot/results/experiments/knot/jer-afterfsr-v1/data/jer_charge_side_after_fsr_v4.h5
  cache: /net/scratch/w00238tl/knot/results/experiments/knot/jer-afterfsr-v1/cache/jer_charge_side_after_fsr_v4.pt
  subset_seed: 42011
  test_size: 0.05
  default_split: validation
  events: {train: null, validation: null, test: null}
  max_assignment_states: 100000
inputs:
  transforms:
    e: log
    eta: [minmax, -5.0, 5.0]
    phi: sincos
    pt: log
    btag: [minmax, 0.0, 6.0]
    charge: [minmax, -1.0, 1.0]
    id: none
    njet: [minmax, 0.0, 20.0]
    nelectron: [minmax, 0.0, 2.0]
    nmuon: [minmax, 0.0, 2.0]
    nBJets_90: [minmax, 0.0, 20.0]
    nBJets_85: [minmax, 0.0, 20.0]
    nBJets_77: [minmax, 0.0, 20.0]
    nBJets_70: [minmax, 0.0, 20.0]
    nBJets_65: [minmax, 0.0, 20.0]
  JET:
    count: 8
    features: [e, eta, phi, pt, btag, charge]
  LEPTON:
    count: 2
    features: [e, eta, phi, pt, charge, id]
  MET:
    count: 1
    features: [phi, pt]
  GLOBAL:
    features: [njet, nelectron, nmuon, nBJets_90, nBJets_85, nBJets_77, nBJets_70, nBJets_65]
model:
  latent: {d_model: 128, n_heads: 4, d_feedforward: 384, dropout: 0.05}
  encoder:
    type: lgatr
    layers: 4
    n_heads: 4
    hidden: {multivector_channels: 8, scalar_channels: 64}
    symmetry_breaking: {beam: xyplane, time: true}
  assignment: {formulation: discriminative}
  mode: factorized
  invisible:
    conditioning: {assignment: none}
    coordinates: {type: met_residual}
    generator: {type: cfm}
    mass_shell:
      enforcement: exact
      mass: {mode: fixed, value: 0.0, parameterization: null}
      roles: {}
  heads:
    point_invisible: {enabled: false}
    parent_four_vector: {enabled: false}
training:
  batch_size: 512
  workers: 4
  optimizer: {type: adamw}
  learning_rate: 0.000361545
  weight_decay: 0.00006073529387441413
  epochs: 20
  precision: 16-mixed
  trainable: [visible, assignment, invisible]
  loss_weights: {assignment: 1.0, invisible: 1.0}
  shared_encoder_gradients: assignment_only
  output: /net/scratch/w00238tl/knot/results/experiments/knot/jer-afterfsr-v1/training/P5
inference:
  seed: 42011
  assignment: {top_k: 1}
  invisible:
    samples_per_assignment: 32
    flow: {steps: 8, solver: heun}
