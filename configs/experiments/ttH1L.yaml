experiment:
  name: ttH1L_joint
  seed: 42
topology_config: configs/topology/ttH1L.yaml
visible_config: configs/m0_ttH1L.yaml

data:
  tensor_cache: /mnt/iusers01/fatpou01/phy01/w00238tl/scratch/SB_paper/results/transformer_full_campaign_joint_first_v2/cache/transformer_ttH_semantic_reconstruction_full__jets8_lep1_met1__tok12__all__filelabels__c48238e2e04b.pt
  max_events: {train: 100000, val: 50000, test: 50000}
  invisible:
    path: null
    allow_synthetic: false

model:
  mode: factorized
  visible: {d_model: 105, n_heads: 3, layers: 4, d_feedforward: 292, dropout: 0.04889685146434}

  reasoning:
    enabled: false
    block_layers: 2
    train_steps: [1, 2, 3, 4]
    eval_steps: 4
    fixed_input_reinjection: true

  reconstruction:
    formulation: discriminative
    flow_matching: {source: mask, max_states: 100000}
    feedback: {enabled: false, start_step: 1, gate_initial_bias: -2.0}

  invisible:
    enabled: false
    formulation: edm
    target: {representation: cartesian, components: [px, py, pz]}
    conditioning: {assignment: soft, allow_truth_oracle: false}
    denoiser: {d_model: 128, n_heads: 4, layers: 4, d_feedforward: 512, dropout: 0.0, zero_init_output: true}
    standard: {training_steps: 1000, inference_steps: 50}
    edm: {sigma_data: 1.0, p_mean: -0.5, p_std: 1.2, sigma_min: 0.004, sigma_max: 160.0, rho: 7.0, inference_nfe: 17}
    flow_matching: {path: linear, coupling: independent, sampler: heun, inference_steps: 8}

  joint_flow:
    recurrent_state: false
    block_layers: 2
    train_steps: [1, 2, 3, 4]

  coupling:
    rounds: 1
    invisible_to_reconstruction: {enabled: false, detach: true, posterior_samples: 4, gate_initial_bias: -2.0}

  compatibility: {enabled: false, include_invisible: true, lambda: 1.0}

inference:
  top_k_assignments: 1
  posterior_samples: 1
  assignment_flow: {steps: 8}
  joint_flow: {steps: 8, solver: euler}

training:
  learning_rate: 0.000361545
  weight_decay: 0.00006073529387441413
  epochs: 20
  precision: 16-mixed
  gradient_clip: 1.0
  accumulate_grad_batches: 1
  loss_weights: {reconstruction: 1.0, invisible: 1.0, compatibility: 1.0}
  freeze: {visible: false, reconstruction: false, invisible: false}
  scheduler: {enabled: true, factor: 0.8, patience: 8, min_lr: 1.0e-6}
  early_stopping: {enabled: true, patience: 20}
  output: results/ttH1L_joint
