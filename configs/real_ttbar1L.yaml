general:
  model: transformer
  topology: ttbar1L
  mode: train
  device: cuda
  seed: 42
tasks:
  classification:
    enabled: false
  reconstruction:
    enabled: true
    weight: 1.0
    label_source: LABELS
    ignore_index: -100
    targets:
      Whad: [[JET, 3], [JET, 4]]
      thad: [[JET, 2], [JET, 3], [JET, 4]]
      tlep: [[JET, 1], [LEPTON, 1]]
dataset:
  input_h5_path: /mnt/iusers01/fatpou01/phy01/w00238tl/scratch/JointEventReconstruction/data/real/ttbar1L_canonical.h5
  max_jets: 8
  max_leptons: 1
  include_met: true
  test_size: 0.2
  limit_events: null
  split:
    indices_path: /mnt/iusers01/fatpou01/phy01/w00238tl/scratch/JointEventReconstruction/data/real/splits/ttbar1L/split_indices.npz
    require_existing: true
  padding_value: 0.0
  train_batch_size: 512
  val_batch_size: 512
  test_batch_size: 512
  train_num_workers: 8
  val_num_workers: 8
  test_num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  cache:
    enabled: false
  observables:
    - INPUTS: JET
      variables: [e, eta, phi, pt, btag, id]
      num_particles: 8
      scalers: [Log, "minmax:min=-2.5,max=2.5", SinCos, Log, "minmax:min=0,max=6", PID]
    - INPUTS: LEPTON
      variables: [e, eta, phi, pt, charge, id]
      num_particles: 1
      scalers: [Log, "minmax:min=-2.5,max=2.5", SinCos, Log, "minmax:min=-1,max=1", PID]
    - INPUTS: MET
      variables: [phi, pt, id]
      num_particles: 1
      scalers: [SinCos, Log, PID]
    - INPUTS: GLOBAL
      variables: [njet, nBJets_90, nBJets_85, nBJets_77, nBJets_70, nBJets_65]
      scalers:
        - "minmax:min=0,max=8"
        - "minmax:min=0,max=8"
        - "minmax:min=0,max=8"
        - "minmax:min=0,max=8"
        - "minmax:min=0,max=8"
        - "minmax:min=0,max=8"
train:
  n_epochs: 20
  learning_rate: 0.000361545
  weight_decay: 0.00006073529387441413
  compute_val_auc: false
  checkpoint: {monitor: val_loss, mode: min, save_top_k: 1, save_last: false}
  early_stopping: {enabled: true, monitor: val_loss, mode: min, patience: 20}
