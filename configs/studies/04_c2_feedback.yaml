study:
  name: c2_feedback
  title: 04 — Can Invisible Reconstruction Correct the Jet Assignment?
  description: Test one explicitly defined detached invisible-posterior assignment correction against matched continued one-pass training.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates, assignment_conditioning]
  inherit: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates, assignment_conditioning]
  training: true
  campaign: {enabled: false, state: deferred, reason: Deferred follow-up study; not on the Paper-1 critical path.}

variants:
  continued_no_feedback:
    label: matched continued one-pass assignment training
    reporting: primary
    patch:
      model: {mode: factorized}
      training: {trainable: [assignment]}
    initialise_from:
    initialise_from_gate: assignment_conditioning
    initialise_components: [visible, assignment, invisible]
    checkpoint_from:
    predictions:
      continued: {label: Matched continued training, patch: {inference: {assignment: {top_k: 5}, invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}

  posterior_feedback:
    label: one-pass assignment plus one detached posterior correction
    reporting: primary
    patch:
      model:
        mode: factorized
        feedback:
          invisible_to_assignment:
            enabled: true
            posterior_samples: 8
            training_sampler: {steps: 17, solver: euler}
      training: {trainable: [assignment, c2]}
    initialise_from:
    initialise_from_gate: assignment_conditioning
    initialise_components: [visible, assignment, invisible]
    checkpoint_from:
    predictions:
      feedback: {label: Detached posterior correction, patch: {inference: {assignment: {top_k: 5}, invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}
