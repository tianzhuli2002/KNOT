study:
  name: c2_feedback
  description: Test whether detached posterior neutrino information improves recurrent assignment on ttbar2L.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  assignment_reference:
    label: Assignment reference (pending Study 01 gate)
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions: {}

  c1:
    label: Assignment reference + soft CFM C1
    reporting: diagnostic
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: soft}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      baseline: {label: C1 baseline, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}

  continued_no_feedback:
    label: Continued assignment training without posterior feedback
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: soft}
      training: {trainable: [assignment]}
    initialise_from: c1
    initialise_components: [visible, assignment, invisible]
    predictions:
      continued: {label: Matched continued training, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}

  c2:
    label: Continued assignment training + detached posterior feedback
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: soft}
        c2:
          posterior_samples: 8
          training_sampler: {steps: 17, solver: euler}
      training: {trainable: [assignment, c2]}
    initialise_from: c1
    initialise_components: [visible, assignment, invisible]
    predictions:
      feedback: {label: C2 feedback, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}
