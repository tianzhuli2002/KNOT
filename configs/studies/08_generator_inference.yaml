study:
  name: generator_inference
  title: 08 — How Much Inference Compute Is Enough?
  description: Scan generator solver and NFE cost from Study-02 checkpoints without retraining.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment]
  inherit: [visible_assignment]
  training: false

variants:
  edm:
    label: EDM inference scan from Study 02
    reporting: primary
    patch:
      model:
        invisible: {conditioning: {assignment: none}, coordinates: {type: cartesian}, generator: {type: edm}}
        mode: factorized
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from: {study: generator_formulations, variant: edm}
    predictions:
      nfe5: {label: EDM NFE=5, patch: {inference: {invisible: {samples_per_assignment: 32, edm: {nfe: 5}}}}, recurrent_steps: null}
      nfe9: {label: EDM NFE=9, patch: {inference: {invisible: {samples_per_assignment: 32, edm: {nfe: 9}}}}, recurrent_steps: null}
      nfe17: {label: EDM NFE=17, patch: {inference: {invisible: {samples_per_assignment: 32, edm: {nfe: 17}}}}, recurrent_steps: null}
      nfe33: {label: EDM NFE=33, patch: {inference: {invisible: {samples_per_assignment: 32, edm: {nfe: 33}}}}, recurrent_steps: null}
      nfe49: {label: EDM NFE=49, patch: {inference: {invisible: {samples_per_assignment: 32, edm: {nfe: 49}}}}, recurrent_steps: null}

  cfm:
    label: CFM inference scan from Study 02
    reporting: primary
    patch:
      model:
        invisible: {conditioning: {assignment: none}, coordinates: {type: cartesian}, generator: {type: cfm}}
        mode: factorized
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from: {study: generator_formulations, variant: cfm}
    predictions:
      euler8: {label: Euler NFE=8, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 8, solver: euler}}}}, recurrent_steps: null}
      heun4: {label: Heun NFE≈8, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 4, solver: heun}}}}, recurrent_steps: null}
      euler16: {label: Euler NFE=16, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 16, solver: euler}}}}, recurrent_steps: null}
      heun8: {label: Heun NFE≈16, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 8, solver: heun}}}}, recurrent_steps: null}
      euler32: {label: Euler NFE=32, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 32, solver: euler}}}}, recurrent_steps: null}
      heun16: {label: Heun NFE≈32, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 16, solver: heun}}}}, recurrent_steps: null}
