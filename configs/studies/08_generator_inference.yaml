study:
  name: generator_inference
  description: Scan generator sampling cost without retraining, using one frozen M3 ttbar2L assignment reference.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  assignment_reference:
    label: M3 assignment reference
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions: {}

  edm:
    label: EDM
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: edm, conditioning: none}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      nfe5: {label: EDM NFE=5, patch: {prediction: {samples: 32, nfe: 5}}, recurrent_steps: 4}
      nfe9: {label: EDM NFE=9, patch: {prediction: {samples: 32, nfe: 9}}, recurrent_steps: 4}
      nfe17: {label: EDM NFE=17, patch: {prediction: {samples: 32, nfe: 17}}, recurrent_steps: 4}
      nfe33: {label: EDM NFE=33, patch: {prediction: {samples: 32, nfe: 33}}, recurrent_steps: 4}
      nfe49: {label: EDM NFE=49, patch: {prediction: {samples: 32, nfe: 49}}, recurrent_steps: 4}

  cfm:
    label: CFM
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: none}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      euler8: {label: Euler NFE=8, patch: {prediction: {samples: 32, steps: 8, solver: euler}}, recurrent_steps: 4}
      heun4: {label: Heun NFE≈8, patch: {prediction: {samples: 32, steps: 4, solver: heun}}, recurrent_steps: 4}
      euler16: {label: Euler NFE=16, patch: {prediction: {samples: 32, steps: 16, solver: euler}}, recurrent_steps: 4}
      heun8: {label: Heun NFE≈16, patch: {prediction: {samples: 32, steps: 8, solver: heun}}, recurrent_steps: 4}
      euler32: {label: Euler NFE=32, patch: {prediction: {samples: 32, steps: 32, solver: euler}}, recurrent_steps: 4}
      heun16: {label: Heun NFE≈32, patch: {prediction: {samples: 32, steps: 16, solver: heun}}, recurrent_steps: 4}
