study:
  name: data_scaling
  description: Measure how the Study 01-selected assignment reference scales from 10k to 500k ttbar2L training events with fixed validation/test samples.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  n10k:
    label: 10k train events
    reporting: primary
    patch:
      data: {events: {train: 10000, validation: 50000, test: 50000}}
      model:
        assignment:
          formulation: discriminative
          refinement:
            train_iterations: [1, 2, 3, 4]
            inference_iterations: 4
            feedback: soft
        mode: factorized
      training: {epochs: 100, early_stopping: {enabled: true, patience: 10}, scheduler: {enabled: true, factor: 0.8, patience: 5, min_lr: 1.0e-6}, trainable: [
            visible, assignment]}
    initialise_from:
    initialise_components: []
    predictions:
      r4: {label: 10k, patch: {}, recurrent_steps: 4}

