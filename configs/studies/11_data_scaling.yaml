study:
  name: data_scaling
  description: Measure selected visible-encoder M1 scaling from 10k to 500k events, with a limited labelled M3 recurrence diagnostic.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment]
  inherit: [visible_assignment]
  training: true

variants:
  n10k:
    label: M1 10k train events
    reporting: primary
    patch: {data: {events: {train: 10000, validation: 50000, test: 50000}}, training: {epochs: 100, early_stopping: {enabled: true, patience: 10}, scheduler: {enabled: true, factor: 0.8, patience: 5, min_lr: 1.0e-6}, trainable: [visible, assignment]}}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions: {default: {label: M1 10k, patch: {}, recurrent_steps: null}}

  n25k:
    label: M1 25k train events
    reporting: primary
    patch: {data: {events: {train: 25000, validation: 50000, test: 50000}}, training: {epochs: 100, early_stopping: {enabled: true, patience: 10}, scheduler: {enabled: true, factor: 0.8, patience: 5, min_lr: 1.0e-6}, trainable: [visible, assignment]}}
