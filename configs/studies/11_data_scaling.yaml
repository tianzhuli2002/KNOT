study:
  name: data_scaling
  title: 11 — Does Visible Recurrence Recover With Much More Training Data?
  description: Compare selected L-GATr M1 and M3 only at 500k training events as a non-blocking recurrence stress test.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment]
  inherit: [visible_assignment]
  training: true

variants:
  n500k:
    label: M1 500k train events
    reporting: primary
    patch: {data: {events: {train: 500000, validation: 50000, test: 50000}}, training: {epochs: 100, early_stopping: {enabled: true, patience: 10}, scheduler: {enabled: true, factor: 0.8, patience: 5, min_lr: 1.0e-6}, trainable: [visible, assignment]}}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions: {default: {label: M1 500k, patch: {}, recurrent_steps: null}}

  m3_n500k:
    label: M3 recurrence diagnostic at 500k
    reporting: diagnostic
    patch: {model: {assignment: {refinement: {train_iterations: [1, 2, 3, 4], inference_iterations: 4, feedback: soft}}}, data: {events: {train: 500000, validation: 50000, test: 50000}}, training: {epochs: 100, early_stopping: {enabled: true, patience: 10}, scheduler: {enabled: true, factor: 0.8, patience: 5, min_lr: 1.0e-6}, trainable: [visible, assignment]}}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions: {r4: {label: M3 diagnostic 500k, patch: {}, recurrent_steps: 4}}
