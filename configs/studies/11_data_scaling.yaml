study:
  name: data_scaling
  description: Measure how the selected recurrent assignment baseline scales from 10k to 500k ttbar2L training events with fixed validation/test samples.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  n10k:
    label: 10k train events
    reporting: primary
    patch:
      data: {events: {train: 10000, validation: 50000, test: 50000}}
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions:
      r4: {label: 10k, patch: {}, recurrent_steps: 4}

