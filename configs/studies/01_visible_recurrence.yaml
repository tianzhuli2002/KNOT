study:
  name: visible_recurrence
  description: Compare one-pass assignment with recurrent refinement, soft feedback, and fixed capacity/compute controls on ttbar2L validation data.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: []
  inherit: []
  training: true

variants:
  m1:
    label: One-pass structured assignment
    reporting: primary
    patch:
      training: {trainable: [visible, assignment]}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions:
      default: {label: One pass, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: null}

  m2:
    label: Recurrent assignment refinement
    reporting: primary
    patch:
      model:
        assignment:
          formulation: discriminative
          refinement:
            train_iterations: [1, 2, 3, 4]
            inference_iterations: 4
        mode: factorized
      training: {trainable: [visible, assignment]}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions:
      r1: {label: R=1, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: 1}
      r2: {label: R=2, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: 2}
      r3: {label: R=3, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: 3}
      r4: {label: R=4, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: 4}
      r8: {label: R=8 diagnostic extrapolation, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: 8}

  m3:
    label: Recurrent assignment + soft feedback
    reporting: primary
    patch:
      model:
        assignment:
          formulation: discriminative
          refinement:
            train_iterations: [1, 2, 3, 4]
            inference_iterations: 4
            feedback: soft
        mode: factorized
      training: {trainable: [visible, assignment]}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions:
      r1: {label: R=1, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: 1}
      r2: {label: R=2, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: 2}
      r3: {label: R=3, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: 3}
      r4: {label: R=4, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: 4}
      r8: {label: R=8 diagnostic extrapolation, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: 8}

  m2_parameter_control:
    label: Parameter-matched non-recurrent control for recurrence
    reporting: diagnostic
    patch:
      model:
        encoder: {layers: 6, d_feedforward: 384}
        mode: factorized
      training: {trainable: [visible, assignment]}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions:
      default: {label: Parameter control, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: null}

  m2_compute_control:
    label: Training-compute-matched non-recurrent control for recurrence
    reporting: diagnostic
    patch:
      model:
        encoder: {layers: 11, d_feedforward: 64}
        mode: factorized
      training: {trainable: [visible, assignment]}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions:
      default: {label: Training-compute control, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: null}

  m3_parameter_control:
    label: Parameter-matched non-recurrent control for soft feedback
    reporting: diagnostic
    patch:
      model:
        encoder: {layers: 7, d_feedforward: 384}
        mode: factorized
      training: {trainable: [visible, assignment]}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions:
      default: {label: Parameter control, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: null}

  m3_compute_control:
    label: Training-compute-matched non-recurrent control for soft feedback
    reporting: diagnostic
    patch:
      model:
        encoder: {layers: 16, d_feedforward: 64}
        mode: factorized
      training: {trainable: [visible, assignment]}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions:
      default: {label: Training-compute control, patch: {inference: {assignment: {top_k: 5}}}, recurrent_steps: null}
