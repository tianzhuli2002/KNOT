study:
  name: visible_recurrence
  description: Compare one-pass assignment, recurrent refinement, and soft assignment feedback on ttbar2L.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  m1:
    label: M1 one-pass
    reporting: primary
    patch:
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions:
      default: {label: M1, patch: {prediction: {top_k: 1}}, recurrent_steps: null}

  m2:
    label: M2 recurrent
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions:
      r1: {label: R=1, patch: {}, recurrent_steps: 1}
      r2: {label: R=2, patch: {}, recurrent_steps: 2}
      r4: {label: R=4, patch: {}, recurrent_steps: 4}
      r8: {label: R=8, patch: {}, recurrent_steps: 8}

  m3:
    label: M3 recurrent + soft feedback
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions:
      r1: {label: R=1, patch: {}, recurrent_steps: 1}
      r2: {label: R=2, patch: {}, recurrent_steps: 2}
      r4: {label: R=4, patch: {}, recurrent_steps: 4}
      r8: {label: R=8, patch: {}, recurrent_steps: 8}
