study:
  name: posterior_size
  title: 09 — How Many Reconstruction Hypotheses Are Enough?
  description: Generate maximum selected factorised/joint posteriors once, then evaluate deterministic nested prefixes offline.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates, joint_model]
  inherit: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates]
  training: false
  campaign: {enabled: false, state: superseded, reason: Posterior-size convergence is folded into Study 10 on the final selected model.}

variants:
  factorized:
    label: selected factorized maximum posterior
    reporting: primary
    patch:
      model:
        mode: factorized
        invisible: {conditioning: {assignment: hypothesis}, generator: {type: cfm}}
    initialise_from:
    initialise_from_gate: invisible_generator
    initialise_components: [visible, assignment, invisible]
    checkpoint_from:
    predictions:
      k10_m64: {label: Generate once at Kmax=10 Mmax=64, patch: {inference: {assignment: {top_k: 10}, invisible: {samples_per_assignment: 64, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}

  joint:
    label: selected joint maximum posterior
    reporting: primary
    patch:
      model:
        mode: joint
        assignment: null
        invisible: null
        feedback: null
        compatibility: null
        joint: {recurrent: false}
    initialise_from:
    initialise_from_gate: joint_model
    initialise_components: [visible]
    checkpoint_from:
    predictions:
      s64: {label: Generate once at Smax=64, patch: {inference: {invisible: {samples_per_assignment: 64, flow: {steps: 8}}, sample_chunk_size: 8}}, recurrent_steps: null}
