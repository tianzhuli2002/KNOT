study:
  name: posterior_size
  description: Generate maximum factorized and joint posteriors once, then evaluate deterministic nested prefixes offline on validation data.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  assignment_reference:
    label: Assignment reference (pending Study 01 gate)
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions: {}

  factorized:
    label: factorized hypothesis CFM
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: hypothesis}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      k10_m64: {label: Generate once at Kmax=10 Mmax=64, patch: {prediction: {top_k: 10, samples: 64, steps: 17, solver: euler}}, recurrent_steps: 4}

  joint:
    label: joint DFM+CFM
    reporting: primary
    patch:
      model:
        assignment: null
        joint_flow: {recurrent: false}
      training: {trainable: [assignment, invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible]
    predictions:
      s64: {label: Generate once at Smax=64, patch: {prediction: {samples: 64, steps: 8, sample_chunk_size: 8}}, recurrent_steps: null}
