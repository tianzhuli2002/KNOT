study:
  name: discrete_assignment
  description: Compare the selected visible encoder with one-pass discriminative assignment and complete-state DFM assignment on matched events.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment]
  inherit: [visible_assignment]
  training: true

variants:
  m1:
    label: selected one-pass discriminative assignment
    reporting: primary
    patch:
      model: {mode: factorized}
      training: {trainable: [visible, assignment]}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions:
      top1: {label: M1, patch: {inference: {assignment: {top_k: 1}}}, recurrent_steps: null}

  dfm:
    label: complete-state DFM assignment
    reporting: primary
    patch:
      model:
        assignment: {formulation: discrete_flow}
        mode: factorized
      training: {trainable: [visible, assignment]}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    predictions:
      s64_t8: {label: DFM S=64 T=8, patch: {inference: {invisible: {samples_per_assignment: 64, flow: {steps: 8}}}}, recurrent_steps: null}
      s64_t16: {label: DFM S=64 T=16, patch: {inference: {invisible: {samples_per_assignment: 64, flow: {steps: 16}}}}, recurrent_steps: null}
