study:
  name: discrete_assignment
  description: Compare discriminative structured assignment and complete-state DFM on the same ttbar2L data and visible encoder scale.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  m1:
    label: discriminative M1
    reporting: diagnostic
    patch:
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions:
      top1: {label: M1, patch: {prediction: {top_k: 1}}, recurrent_steps: null}

  m3:
    label: discriminative M3
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions:
      top1: {label: M3, patch: {prediction: {top_k: 1}}, recurrent_steps: 4}

  dfm:
    label: complete-state DFM
    reporting: primary
    patch:
      model:
        assignment: {method: dfm}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions:
      s64_t8: {label: DFM S=64 T=8, patch: {prediction: {samples: 64, steps: 8}}, recurrent_steps: null}
      s64_t16: {label: DFM S=64 T=16, patch: {prediction: {samples: 64, steps: 16}}, recurrent_steps: null}
