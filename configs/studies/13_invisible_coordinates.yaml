study:
  name: invisible_coordinates
  description: Compare Cartesian, MET-residual and diagnostic MET-exact invisible coordinates at fixed visible assignment and generator semantics.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  assignment_reference:
    label: Visible-assignment reference (pending human gates)
    reporting: setup
    patch:
      model:
        assignment: {formulation: discriminative, refinement: {train_iterations: [1, 2, 3, 4], inference_iterations: 4, feedback: soft}}
        mode: factorized
      training: {trainable: [visible, assignment]}
    initialise_from:
    initialise_components: []
    predictions: {}

  cartesian:
    label: Cartesian invisible coordinates
    reporting: primary
    patch:
      model:
        assignment: {formulation: discriminative, refinement: {train_iterations: [1, 2, 3, 4], inference_iterations: 4, feedback: soft}}
        invisible: {conditioning: {assignment: none}, coordinates: {type: cartesian}, generator: {type: cfm}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      default: {label: Cartesian, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: 4}

  met_residual:
    label: MET-residual invisible coordinates
    reporting: primary
    patch:
      model:
        assignment: {formulation: discriminative, refinement: {train_iterations: [1, 2, 3, 4], inference_iterations: 4, feedback: soft}}
        invisible: {conditioning: {assignment: none}, coordinates: {type: met_residual}, generator: {type: cfm}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      default: {label: MET residual, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: 4}

  met_exact:
    label: MET-exact projection diagnostic
    reporting: diagnostic
    patch:
      model:
        assignment: {formulation: discriminative, refinement: {train_iterations: [1, 2, 3, 4], inference_iterations: 4, feedback: soft}}
        invisible: {conditioning: {assignment: none}, coordinates: {type: met_exact}, generator: {type: cfm}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      default: {label: MET exact diagnostic, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: 4}
