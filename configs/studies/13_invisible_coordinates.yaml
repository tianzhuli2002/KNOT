study:
  name: invisible_coordinates
  description: Compare Cartesian, MET-residual and diagnostic MET-exact invisible coordinates at fixed visible assignment and generator semantics.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  assignment_reference:
    label: Visible-assignment reference (pending human gates)
    reporting: setup
    patch:
      model:
        assignment: {method: discriminative, recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions: {}

  cartesian:
    label: Cartesian invisible coordinates
    reporting: primary
    patch:
      model:
        assignment: {method: discriminative, recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}}
        invisible: {method: cfm, conditioning: none, coordinates: {type: cartesian}}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      default: {label: Cartesian, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}

  met_residual:
    label: MET-residual invisible coordinates
    reporting: primary
    patch:
      model:
        assignment: {method: discriminative, recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}}
        invisible: {method: cfm, conditioning: none, coordinates: {type: met_residual}}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      default: {label: MET residual, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}

  met_exact:
    label: MET-exact projection diagnostic
    reporting: diagnostic
    patch:
      model:
        assignment: {method: discriminative, recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}}
        invisible: {method: cfm, conditioning: none, coordinates: {type: met_exact}}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      default: {label: MET exact diagnostic, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}
