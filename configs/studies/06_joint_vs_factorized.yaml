study:
  name: joint_vs_factorized
  description: Compare explicit p(A|X)p(nu|X,A) with native joint DFM+CFM on ttbar2L.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: test

variants:
  assignment_reference:
    label: M3 assignment reference
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions: {}

  factorized:
    label: factorized hypothesis CFM
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: hypothesis}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      k5_m16: {label: factorized K=5 M=16, patch: {prediction: {top_k: 5, samples: 16, steps: 17, solver: euler}}, recurrent_steps: 4}

  joint:
    label: joint DFM+CFM
    reporting: primary
    patch:
      model:
        assignment: null
        joint_flow: {recurrent: false}
      training: {trainable: [assignment, invisible]}
    initialise_from: factorized
    initialise_components: [visible, invisible]
    predictions:
      s64_t8: {label: joint S=64 T=8, patch: {prediction: {samples: 64, steps: 8, sample_chunk_size: 8}}, recurrent_steps: null}
      s64_t16: {label: joint S=64 T=16, patch: {prediction: {samples: 64, steps: 16, sample_chunk_size: 8}}, recurrent_steps: null}
