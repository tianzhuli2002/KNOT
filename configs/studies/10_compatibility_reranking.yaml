study:
  name: compatibility_reranking
  description: Reuse selected factorised components, generate one posterior, and scan explicit compatibility weights offline.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment, assignment_formulation, assignment_conditioning, invisible_generator, invisible_coordinates]
  inherit: [visible_assignment, assignment_formulation, assignment_conditioning, invisible_generator, invisible_coordinates]
  training: true

variants:
  compatibility:
    label: learned visible/invisible compatibility reranking
    reporting: primary
    patch:
      model:
        mode: factorized
        compatibility: {}
      training: {trainable: [compatibility]}
    initialise_from:
    initialise_from_gate: assignment_conditioning
    initialise_components: [visible, assignment, invisible]
    checkpoint_from:
    predictions:
      posterior: {label: One stored posterior for offline weight scan, patch: {inference: {assignment: {top_k: 10}, invisible: {samples_per_assignment: 16, flow: {steps: 17, solver: euler}}, compatibility: {weight: 0.0}}}, recurrent_steps: null}
