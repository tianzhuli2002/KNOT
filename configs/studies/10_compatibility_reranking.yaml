study:
  name: compatibility_reranking
  description: Train a compatibility head on a frozen ttbar2L factorized model and scan reranking strength without retraining.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  assignment_reference:
    label: M3 assignment reference
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions: {}

  factorized:
    label: factorized hypothesis CFM
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: hypothesis}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions: {}

  compatibility:
    label: compatibility reranking
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: hypothesis}
        compatibility: {}
      training: {trainable: [compatibility]}
    initialise_from: factorized
    initialise_components: [visible, assignment, invisible]
    predictions:
      w0: {label: weight=0, patch: {prediction: {top_k: 10, samples: 16, steps: 17, solver: euler, compatibility_weight: 0.0}}, recurrent_steps: 4}
      w025: {label: weight=0.25, patch: {prediction: {top_k: 10, samples: 16, steps: 17, solver: euler, compatibility_weight: 0.25}}, recurrent_steps: 4}
      w05: {label: weight=0.5, patch: {prediction: {top_k: 10, samples: 16, steps: 17, solver: euler, compatibility_weight: 0.5}}, recurrent_steps: 4}
      w1: {label: weight=1, patch: {prediction: {top_k: 10, samples: 16, steps: 17, solver: euler, compatibility_weight: 1.0}}, recurrent_steps: 4}
      w2: {label: weight=2, patch: {prediction: {top_k: 10, samples: 16, steps: 17, solver: euler, compatibility_weight: 2.0}}, recurrent_steps: 4}
      w4: {label: weight=4, patch: {prediction: {top_k: 10, samples: 16, steps: 17, solver: euler, compatibility_weight: 4.0}}, recurrent_steps: 4}
