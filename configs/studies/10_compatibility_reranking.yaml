study:
  name: compatibility_reranking
  title: 10 — Can Invisible Physics Resolve the Jet Assignment?
  description: Reuse selected factorised components, generate one posterior, and evaluate visible, analytic, learned, and truth-neutrino hypothesis reranking offline.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates, invisible_backbone]
  inherit: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates, invisible_backbone]
  # The expensive posterior is produced by the selected invisible model.  This
  # study is an offline hypothesis-evaluation/scorer study, not a second flow
  # training campaign.
  training: false

variants:
  compatibility:
    label: learned visible/invisible compatibility reranking
    reporting: primary
    patch: {model: {mode: factorized}}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    checkpoint_from_gate: invisible_backbone
    predictions:
      posterior: {label: One stored posterior for offline hypothesis evaluation, patch: {inference: {assignment: {top_k: 10}, invisible: {samples_per_assignment: 32, flow: {steps: 4, solver: heun}}}}, recurrent_steps: null}
