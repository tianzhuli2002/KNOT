study:
  name: compatibility_reranking
  description: Train a compatibility head, generate hypotheses once, and scan reranking weight offline on validation data.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  assignment_reference:
    label: Assignment reference (pending Study 01 gate)
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions: {}

  factorized:
    label: factorized hypothesis CFM
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: hypothesis}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions: {}

  compatibility:
    label: compatibility reranking
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: hypothesis}
        compatibility: {}
      training: {trainable: [compatibility]}
    initialise_from: factorized
    initialise_components: [visible, assignment, invisible]
    predictions:
      posterior: {label: One stored posterior for offline weight scan, patch: {prediction: {top_k: 10, samples: 16, steps: 17, solver: euler, compatibility_weight: 0.0}}, recurrent_steps: 4}
