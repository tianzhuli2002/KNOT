study:
  name: generator_formulations
  description: Compare DDIM, EDM, CFM, OT-CFM and condition-aware OT CFM in Cartesian coordinates with one frozen visible-assignment reference.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  assignment_reference:
    label: Assignment reference (pending Study 01 gate)
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions: {}

  ddim:
    label: DDIM
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: ddim, conditioning: none, coordinates: {type: cartesian}}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      nfe17: {label: DDIM NFE=17, patch: {prediction: {samples: 32, steps: 17}}, recurrent_steps: 4}

  edm:
    label: EDM
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: edm, conditioning: none, coordinates: {type: cartesian}}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      nfe17: {label: EDM NFE=17, patch: {prediction: {samples: 32, nfe: 17}}, recurrent_steps: 4}

  cfm:
    label: CFM
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: none, coordinates: {type: cartesian}}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      nfe17: {label: CFM Euler NFE=17, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}

  ot_cfm:
    label: OT-CFM
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: none, coordinates: {type: cartesian}, coupling: minibatch_ot}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      nfe17: {label: OT-CFM Euler NFE=17, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}

  conditional_ot_cfm:
    label: Condition-aware OT / C2OT-style CFM
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible:
          method: cfm
          conditioning: none
          coordinates: {type: cartesian}
          coupling: {method: conditional_ot, condition_weight: 1.0}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      nfe17: {label: Condition-aware OT CFM Euler NFE=17, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}
