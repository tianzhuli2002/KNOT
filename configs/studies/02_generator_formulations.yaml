study:
  name: generator_formulations
  title: 02 — What Generative Objective Best Models the Invisible Posterior?
  description: Compare EDM, CFM, OT-CFM and condition-aware OT CFM with the human-selected visible system.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment]
  inherit: [visible_assignment]
  training: true

variants:
  edm:
    label: EDM
    reporting: primary
    patch:
      model:
        invisible:
          conditioning: {assignment: none}
          coordinates: {type: cartesian}
          generator: {type: edm}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      nfe17: {label: EDM NFE=17, patch: {inference: {invisible: {samples_per_assignment: 32, edm: {nfe: 17}}}}, recurrent_steps: null}

  cfm:
    label: CFM
    reporting: primary
    patch:
      model:
        invisible:
          conditioning: {assignment: none}
          coordinates: {type: cartesian}
          generator: {type: cfm}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      nfe17: {label: CFM Euler NFE=17, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}

  ot_cfm:
    label: OT-CFM
    reporting: primary
    patch:
      model:
        invisible:
          conditioning: {assignment: none}
          coordinates: {type: cartesian}
          generator: {type: cfm, coupling: {type: minibatch_ot, condition_weight: 0.0}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      nfe17: {label: OT-CFM Euler NFE=17, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}

  conditional_ot_cfm:
    label: Condition-aware OT / C2OT-style CFM
    reporting: primary
    patch:
      model:
        invisible:
          conditioning: {assignment: none}
          coordinates: {type: cartesian}
          generator:
            type: cfm
            coupling: {condition_weight: 1.0, type: conditional_ot}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      nfe17: {label: Condition-aware OT CFM Euler NFE=17, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}
