study:
  name: assignment_conditioning
  description: Test how assignment information changes CFM invisible inference on one frozen M3 ttbar2L assignment model.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: test

variants:
  assignment_reference:
    label: M3 assignment reference
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions: {}

  none:
    label: no assignment conditioning
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: none}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      default: {label: none, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}

  soft:
    label: soft C1 conditioning
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: soft}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      default: {label: soft, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}

  hypothesis:
    label: predicted-hypothesis factorisation
    reporting: primary
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: hypothesis}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      k5_m32: {label: hypothesis K=5 M=32, patch: {prediction: {top_k: 5, samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}

  hard:
    label: hard local assignment diagnostic
    reporting: diagnostic
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: hard}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      default: {label: hard, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}

  truth_oracle:
    label: truth-assignment oracle
    reporting: oracle
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
        invisible: {method: cfm, conditioning: truth_oracle}
      training: {trainable: [invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible, assignment]
    predictions:
      oracle: {label: truth oracle, patch: {prediction: {samples: 32, steps: 17, solver: euler}}, recurrent_steps: 4}
