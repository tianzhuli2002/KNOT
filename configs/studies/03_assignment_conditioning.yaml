study:
  name: assignment_conditioning
  title: 03 — Does Jet-Assignment Uncertainty Matter for Invisible Reconstruction?
  description: "After compatibility reranking, test one reverse information pass: whether the refined assignment improves the invisible posterior; truth assignment remains an oracle."
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates, invisible_backbone, assignment_coupling]
  inherit: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates, invisible_backbone]
  training: true

variants:
  none:
    label: unconditioned invisible posterior
    reporting: primary
    patch:
      model:
        invisible: {conditioning: {assignment: none}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate:
    initialise_components: []
    checkpoint_from:
    checkpoint_from_gate: invisible_backbone
    predictions:
      default: {label: none, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 4, solver: heun}}}}, recurrent_steps: null}

  refined:
    label: refined assignment conditioning
    reporting: primary
    patch:
      model:
        invisible: {conditioning: {assignment: hypothesis}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      default: {label: refined assignment, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 4, solver: heun}}}}, recurrent_steps: null}

  truth_oracle:
    label: truth-assignment oracle
    reporting: oracle
    patch:
      model:
        invisible: {conditioning: {assignment: truth_oracle}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      oracle: {label: truth oracle, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 4, solver: heun}}}}, recurrent_steps: null}
