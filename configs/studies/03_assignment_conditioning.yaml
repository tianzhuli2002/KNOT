study:
  name: assignment_conditioning
  description: Measure how selected assignment information changes invisible reconstruction, including wrong-assignment damage and top-K headroom.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates]
  inherit: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates]
  training: true

variants:
  none:
    label: no assignment conditioning
    reporting: primary
    patch:
      model:
        invisible: {conditioning: {assignment: none}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      default: {label: none, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}

  soft:
    label: soft assignment conditioning
    reporting: primary
    patch:
      model:
        invisible: {conditioning: {assignment: soft}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      default: {label: soft, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}

  hypothesis:
    label: predicted-hypothesis factorisation
    reporting: primary
    patch:
      model:
        invisible: {conditioning: {assignment: hypothesis}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      k1_m32: {label: hypothesis K=1 M=32, patch: {inference: {assignment: {top_k: 1}, invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}
      k5_m32: {label: hypothesis K=5 M=32, patch: {inference: {assignment: {top_k: 5}, invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}

  hard:
    label: hard local assignment diagnostic
    reporting: diagnostic
    patch:
      model:
        invisible: {conditioning: {assignment: hard}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      default: {label: hard, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}

  truth_oracle:
    label: truth-assignment oracle
    reporting: oracle
    patch:
      model:
        invisible: {conditioning: {assignment: truth_oracle}}
        mode: factorized
      training: {trainable: [invisible]}
    initialise_from:
    initialise_from_gate: visible_assignment
    initialise_components: [visible, assignment]
    checkpoint_from:
    predictions:
      oracle: {label: truth oracle, patch: {inference: {invisible: {samples_per_assignment: 32, flow: {steps: 17, solver: euler}}}}, recurrent_steps: null}
