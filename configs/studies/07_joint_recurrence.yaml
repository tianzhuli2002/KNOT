study:
  name: joint_recurrence
  description: Compare stateless and persistent-topology-state joint DFM+CFM on ttbar2L.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42]
  split: validation

variants:
  assignment_reference:
    label: Assignment reference (pending Study 01 gate)
    reporting: setup
    patch:
      model:
        assignment:
          method: discriminative
          recurrence: {train_steps: [1, 2, 3, 4], eval_steps: 4, feedback: soft}
      training: {trainable: [visible, assignment]}
    initialise_from: null
    initialise_components: []
    predictions: {}

  stateless:
    label: joint stateless
    reporting: primary
    patch:
      model:
        assignment: null
        joint_flow: {recurrent: false}
      training: {trainable: [assignment, invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible]
    predictions:
      t8: {label: stateless T=8, patch: {prediction: {samples: 64, steps: 8, sample_chunk_size: 8}}, recurrent_steps: null}
      t16: {label: stateless T=16, patch: {prediction: {samples: 64, steps: 16, sample_chunk_size: 8}}, recurrent_steps: null}

  recurrent:
    label: joint recurrent topology state
    reporting: primary
    patch:
      model:
        assignment: null
        joint_flow: {recurrent: true, train_steps: [1, 2, 3, 4]}
      training: {trainable: [assignment, invisible]}
    initialise_from: assignment_reference
    initialise_components: [visible]
    predictions:
      t8: {label: recurrent T=8, patch: {prediction: {samples: 64, steps: 8, sample_chunk_size: 8}}, recurrent_steps: null}
      t16: {label: recurrent T=16, patch: {prediction: {samples: 64, steps: 16, sample_chunk_size: 8}}, recurrent_steps: null}
