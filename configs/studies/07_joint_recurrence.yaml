study:
  name: joint_recurrence
  title: 07 — Does Iterative Joint Co-Refinement Add Anything?
  description: Conditional diagnostic for persistent joint topology state after the joint-model gate; final recurrence design remains a human scientific choice.
  experiment_pattern: configs/experiments/{topology}.yaml
  topologies: [ttbar2L]
  seeds: [42, 43, 44]
  split: validation
  requires: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates, assignment_conditioning, invisible_feedback, joint_model]
  inherit: [visible_assignment, assignment_formulation, invisible_generator, invisible_coordinates, assignment_conditioning, joint_model]
  training: true
  campaign: {enabled: false, state: deferred, reason: Deferred follow-up study; no joint recurrence scan is released in Paper-1.}

variants:
  stateless:
    label: joint stateless diagnostic
    reporting: primary
    patch:
      model:
        mode: joint
        assignment: null
        invisible: null
        feedback: null
        compatibility: null
        joint: {recurrent: false}
      training: {trainable: [assignment, invisible]}
    initialise_from:
    initialise_from_gate: joint_model
    initialise_components: [visible]
    checkpoint_from:
    predictions:
      t8: {label: stateless T=8, patch: {inference: {invisible: {samples_per_assignment: 64, flow: {steps: 8}}, sample_chunk_size: 8}}, recurrent_steps: null}
      t16: {label: stateless T=16, patch: {inference: {invisible: {samples_per_assignment: 64, flow: {steps: 16}}, sample_chunk_size: 8}}, recurrent_steps: null}

  recurrent:
    label: existing persistent joint topology state (conditional diagnostic)
    reporting: diagnostic
    patch:
      model:
        mode: joint
        assignment: null
        invisible: null
        feedback: null
        compatibility: null
        joint: {recurrent: true, train_steps: [1, 2, 3, 4]}
      training: {trainable: [assignment, invisible]}
    initialise_from:
    initialise_from_gate: joint_model
    initialise_components: [visible]
    checkpoint_from:
    predictions:
      t8: {label: recurrent T=8, patch: {inference: {invisible: {samples_per_assignment: 64, flow: {steps: 8}}, sample_chunk_size: 8}}, recurrent_steps: null}
      t16: {label: recurrent T=16, patch: {inference: {invisible: {samples_per_assignment: 64, flow: {steps: 16}}, sample_chunk_size: 8}}, recurrent_steps: null}
